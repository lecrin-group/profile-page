  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:300;
    line-height:1.6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:8px 20px 80px;
  }
  /* ---- hero (全要素を画像の上に) ---- */
  .hero{
    position:relative;
    width:100%;
    max-width:520px;
    aspect-ratio:1050/600;
    background:var(--hero-img) center/cover no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(250,250,248,0) 60%,rgba(250,250,248,.8) 88%,var(--bg) 100%);
    pointer-events:none;
  }
  .hero-inner{position:relative;z-index:2;opacity:0;animation:rise .9s ease .1s forwards;}
  .hero .mark{
    width:66px;height:66px;margin:0 auto 16px;
    border:1px solid var(--ink);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Cormorant Garamond",serif;font-size:31px;font-weight:500;letter-spacing:1px;
    background:rgba(255,255,255,.45);backdrop-filter:blur(2px);
  }
  .hero .name{
    font-family:"Cormorant Garamond",serif;
    font-size:40px;font-weight:600;letter-spacing:3px;margin-bottom:6px;color:var(--ink);
    text-shadow:0 1px 14px rgba(255,255,255,.85),0 0 28px rgba(255,255,255,.6);
  }
  .hero .name-ja{font-size:16px;color:#4a463f;letter-spacing:6px;margin-bottom:14px;font-weight:500;text-shadow:0 1px 8px rgba(255,255,255,.9);}
  .hero .role{font-size:12.5px;color:#5d5953;letter-spacing:1.5px;line-height:1.9;text-shadow:0 1px 8px rgba(255,255,255,.85);}
  .hero .role b{font-weight:600;color:var(--ink);}
  /* ---- lang switch ---- */
  .lang{
    position:fixed;
    top:18px;right:18px;
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  .lang button{
    border:none;background:none;cursor:pointer;
    font-family:"Cormorant Garamond",serif;
    font-size:13px;letter-spacing:1px;font-weight:600;
    padding:5px 13px;border-radius:999px;
    color:var(--sub);
    transition:background .25s,color .25s;
  }
  .lang button.on{background:var(--ink);color:#fff;}
  /* ---- header ---- */
  .head{
    text-align:center;
    margin-bottom:52px;
  }
  .mark{
    width:64px;height:64px;
    margin:0 auto 22px;
    border:1px solid var(--ink);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Cormorant Garamond",serif;
    font-size:30px;font-weight:500;letter-spacing:1px;
  }
  .name{
    font-family:"Cormorant Garamond",serif;
    font-size:34px;font-weight:500;letter-spacing:2px;margin-bottom:6px;
  }
  .name-ja{font-size:13px;color:var(--sub);letter-spacing:4px;margin-bottom:18px;}
  .role{font-size:12.5px;color:var(--sub);letter-spacing:1.5px;line-height:1.9;}
  .role b{font-weight:500;color:var(--ink);}
  /* ---- section ---- */
  .sec{margin-bottom:38px;}
  .sec-t{
    font-family:"Cormorant Garamond",serif;
    font-size:13px;letter-spacing:3px;text-transform:uppercase;
    color:var(--sub);margin-bottom:14px;
    display:flex;align-items:center;gap:12px;
  }
  .sec-t::after{content:"";flex:1;height:1px;background:var(--line);}
  /* ---- link ---- */
  a.link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin-bottom:10px;
    text-decoration:none;color:var(--ink);
    transition:transform .25s ease,border-color .25s ease,background .25s ease;
  }
  a.link:hover{transform:translateY(-2px);border-color:var(--ink);background:var(--hover);}
  a.link:active{transform:translateY(0);}
  .ic{
    width:38px;height:38px;flex:none;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;background:var(--bg);border:1px solid var(--line);
  }
  .ic svg{width:19px;height:19px;}
  .lt{flex:1;min-width:0;}
  .lt .desc{font-size:12px;color:var(--ink);font-weight:400;letter-spacing:.3px;margin-bottom:3px;line-height:1.45;white-space:normal;}
  .lt .l1{display:inline-block;font-size:14.5px;font-weight:400;letter-spacing:.3px;margin-right:9px;}
  .lt .l2{font-size:11.5px;color:var(--sub);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .arr{color:var(--sub);font-size:14px;flex:none;transition:transform .25s ease;}
  a.link:hover .arr{transform:translateX(3px);}
  /* ---- footer ---- */
  .foot{
    text-align:center;margin-top:48px;font-size:11px;color:var(--sub);
    letter-spacing:1.5px;font-family:"Cormorant Garamond",serif;
  }
  /* ---- anim ---- */
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .fade .head{opacity:0;animation:rise .8s ease forwards;animation-delay:.05s;}
  .fade .sec:nth-of-type(1){opacity:0;animation:rise .8s ease forwards;animation-delay:.15s;}
  .fade .sec:nth-of-type(2){opacity:0;animation:rise .8s ease forwards;animation-delay:.25s;}
  .fade .sec:nth-of-type(3){opacity:0;animation:rise .8s ease forwards;animation-delay:.35s;}
  .fade .sec:nth-of-type(4){opacity:0;animation:rise .8s ease forwards;animation-delay:.45s;}
</style>

/* ===== render ===== */
function render(lang){
  const d = DATA[lang];

  // ---- hero: 全要素を画像の上に ----
  let hero = '<div class="hero-inner">';

  if(d.nameJa) hero += '<div class="name-ja">'+d.nameJa+'</div>';
  hero += '<p class="role">'+d.role+'</p>';
  hero += '</div>';
  document.getElementById('hero').innerHTML = hero;

  // ---- links ----
  let html = '';
  d.sections.forEach(sec=>{
    html += '<section class="sec"><div class="sec-t">'+sec.t+'</div>';
    sec.links.forEach(k=>{
      html += '<a class="link" href="'+k.u+'" target="_blank" rel="noopener">';
      html += IC[k.ic];
      html += '<span class="lt">';
      if(k.desc) html += '<span class="desc">'+k.desc+'</span>';
      html += '<span class="l1">'+k.l1+'</span><span class="l2">'+k.l2+'</span>';
      html += '</span><span class="arr">→</span></a>';
    });
    html += '</section>';
  });
  html += '<div class="foot">© Nagisa Sato</div>';

  const wrap = document.getElementById('wrap');
  wrap.classList.remove('fade');
  void wrap.offsetWidth;
  wrap.classList.add('fade');
  wrap.innerHTML = html;
}

function setLang(lang){
  document.documentElement.lang = lang;
  document.getElementById('btn-ja').classList.toggle('on', lang==='ja');
  document.getElementById('btn-en').classList.toggle('on', lang==='en');
  render(lang);
}

const initLang = (navigator.language||'ja').toLowerCase().startsWith('en') ? 'en' : 'ja';
