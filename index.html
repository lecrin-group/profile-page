  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:300;
    line-height:1.6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:8px 20px 80px;
  }
  /* ---- hero (全要素を画像の上に) ---- */
  .hero{
    position:relative;
    width:100%;
    max-width:520px;
    aspect-ratio:1050/600;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    padding-top:96px;
    box-sizing:border-box;
  }
  @media(max-width:400px){
    .hero{padding-top:88px;aspect-ratio:auto;min-height:78vw;}
  }
  .hero::before{
    content:"";position:absolute;inset:-4%;
    background:var(--hero-img) center/cover no-repeat;
    -webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);
    pointer-events:none;z-index:0;
    animation:inkBreath 18s ease-in-out infinite;
    will-change:transform;
  }
  .hero::after{
    content:"";position:absolute;left:0;right:0;
    top:50%;height:46%;transform:translateY(-50%);
    background:linear-gradient(to bottom,rgba(250,250,248,0) 0%,rgba(250,250,248,.72) 28%,rgba(250,250,248,.72) 72%,rgba(250,250,248,0) 100%);
    pointer-events:none;z-index:1;
    animation:bandPulse 7s ease-in-out infinite;
  }
  @keyframes inkBreath{
    0%{transform:scale(1) translate(0,0);}
    33%{transform:scale(1.06) translate(1.2%,-1%);}
    66%{transform:scale(1.03) translate(-1.2%,.8%);}
    100%{transform:scale(1) translate(0,0);}
  }
  @keyframes bandPulse{
    0%,100%{opacity:.85;}
    50%{opacity:1;}
  }
  .hero-inner{position:relative;z-index:2;opacity:0;animation:rise .9s ease .1s forwards;}
  .hero .mark{
    width:66px;height:66px;margin:0 auto 16px;
    border:1px solid var(--ink);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Cormorant Garamond",serif;font-size:31px;font-weight:500;letter-spacing:1px;
    background:rgba(255,255,255,.45);backdrop-filter:blur(2px);
  }
  .hero .name{
    font-family:"Cormorant Garamond",serif;
    font-size:40px;font-weight:600;letter-spacing:3px;margin-bottom:6px;color:var(--ink);
    text-shadow:0 1px 14px rgba(255,255,255,.85),0 0 28px rgba(255,255,255,.6);
  }
  .hero .name .ch{
    display:inline-block;opacity:0;
    transform:translateY(14px) scale(.96);
    filter:blur(4px);
    animation:charIn .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes charIn{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}
  .hero .name-ja{font-size:16px;color:#4a463f;letter-spacing:6px;margin-bottom:14px;font-weight:500;text-shadow:0 1px 8px rgba(255,255,255,.9);
    opacity:0;animation:rise .9s ease forwards;animation-delay:.85s;}
  .hero .role{font-size:12.5px;color:#5d5953;letter-spacing:1.5px;line-height:1.9;text-shadow:0 1px 8px rgba(255,255,255,.85);
    opacity:0;animation:rise .9s ease forwards;animation-delay:1.0s;}
  .hero .role b{font-weight:600;color:var(--ink);}
  /* ---- hero flash (初回ロード時の一閃) ---- */
  .flash{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;}
  .flash::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.95) 0%,rgba(255,250,240,.75) 30%,rgba(255,245,225,0) 70%);
    opacity:0;animation:flashGlow 1.5s ease-out forwards;
  }
  .flash::after{
    content:"";position:absolute;top:-30%;left:-60%;
    width:45%;height:160%;
    background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 100%);
    transform:skewX(-18deg);
    animation:flashSweep 1.25s cubic-bezier(.4,0,.2,1) .15s forwards;
  }
  @keyframes flashGlow{
    0%{opacity:0;}
    12%{opacity:1;}
    100%{opacity:0;}
  }
  @keyframes flashSweep{
    0%{left:-60%;}
    100%{left:160%;}
  }
  /* ---- lang switch ---- */
  .lang{
    position:fixed;
    top:14px;right:14px;
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:2px;
    max-width:min(64vw,260px);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:4px;
    z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  .lang button{
    border:none;background:none;cursor:pointer;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:11px;letter-spacing:.3px;font-weight:500;
    padding:4px 9px;border-radius:999px;
    color:var(--sub);white-space:nowrap;
    transition:background .25s,color .25s;
  }
  @media(max-width:400px){
    .lang{top:10px;right:10px;padding:3px;gap:1px;}
    .lang button{font-size:10.5px;padding:4px 7px;}
  }
  .lang button.on{background:var(--ink);color:#fff;}
  /* ---- header ---- */
  .head{
    text-align:center;
    margin-bottom:52px;
  }
  .mark{
    width:64px;height:64px;
    margin:0 auto 22px;
    border:1px solid var(--ink);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Cormorant Garamond",serif;
    font-size:30px;font-weight:500;letter-spacing:1px;
  }
  .name{
    font-family:"Cormorant Garamond",serif;
    font-size:34px;font-weight:500;letter-spacing:2px;margin-bottom:6px;
  }
  .name-ja{font-size:13px;color:var(--sub);letter-spacing:4px;margin-bottom:18px;}
  .role{font-size:12.5px;color:var(--sub);letter-spacing:1.5px;line-height:1.9;}
  .role b{font-weight:500;color:var(--ink);}
  /* ---- section ---- */
  .sec{margin-bottom:38px;}
  .sec-t{
    font-family:"Cormorant Garamond",serif;
    font-size:13px;letter-spacing:3px;text-transform:uppercase;
    color:var(--sub);margin-bottom:14px;
    display:flex;align-items:center;gap:12px;
  }
  .sec-t::after{content:"";flex:1;height:1px;background:var(--line);}
  /* ---- link ---- */
  a.link{
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin-bottom:10px;
    text-decoration:none;color:var(--ink);
    transition:transform .3s cubic-bezier(.2,.7,.3,1),border-color .25s ease,background .25s ease,box-shadow .3s ease;
  }
  a.link::before{
    content:"";position:absolute;top:0;left:-75%;width:50%;height:100%;
    background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);
    transform:skewX(-18deg);pointer-events:none;opacity:0;
  }
  a.link:hover{transform:translateY(-3px);border-color:var(--ink);background:var(--hover);box-shadow:0 10px 28px rgba(0,0,0,.07);}
  a.link:hover::before{opacity:1;animation:shine .85s ease;}
  @keyframes shine{from{left:-75%;}to{left:130%;}}
  a.link:active{transform:translateY(-1px) scale(.99);}
  a.link.biz-link{padding:18px 19px;gap:16px;border-radius:16px;}
  a.link.biz-link .ic{width:44px;height:44px;border-radius:12px;font-size:21px;}
  a.link.biz-link .ic svg{width:22px;height:22px;}
  .ic{
    width:38px;height:38px;flex:none;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;background:var(--bg);border:1px solid var(--line);
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  a.link:hover .ic{transform:scale(1.12) rotate(-3deg);}
  .ic svg{width:19px;height:19px;}
  .lt{flex:1;min-width:0;}
  .lt .desc{font-size:11px;color:var(--sub);font-weight:400;letter-spacing:.3px;margin-bottom:4px;line-height:1.5;white-space:normal;}
  .lt.biz .desc{font-size:12.5px;color:#6b6760;font-weight:500;margin-bottom:5px;line-height:1.5;}
  .lt .l1{display:inline-block;font-size:14.5px;font-weight:400;letter-spacing:.3px;margin-right:9px;}
  .lt.biz .l1{font-size:17px;font-weight:700;letter-spacing:.4px;display:block;margin-right:0;margin-bottom:3px;}
  .lt .l2{font-size:11.5px;color:var(--sub);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .arr{color:var(--sub);font-size:14px;flex:none;transition:transform .25s ease;}
  a.link:hover .arr{transform:translateX(3px);}
  /* ---- footer ---- */
  .foot{
    text-align:center;margin-top:48px;font-size:11px;color:var(--sub);
    letter-spacing:1.5px;font-family:"Cormorant Garamond",serif;
  }
  .note{
    font-size:11.5px;color:var(--sub);line-height:1.7;letter-spacing:.2px;
    margin:6px 4px 0;padding-left:2px;
  }
  .divider{
    display:flex;align-items:center;gap:12px;
    margin:22px 2px 14px;
    font-size:11px;color:var(--sub);letter-spacing:2px;
    font-family:"Cormorant Garamond",serif;text-transform:uppercase;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .divider.main{
    font-size:13px;color:var(--ink);font-weight:600;letter-spacing:3px;
    margin:8px 2px 16px;
  }
  .divider.main::before,.divider.main::after{background:var(--ink);opacity:.35;}
  /* ---- toast ---- */
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;
    font-size:13px;letter-spacing:.5px;
    padding:11px 20px;border-radius:999px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
    opacity:0;pointer-events:none;z-index:100;
    transition:opacity .3s,transform .3s;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ---- anim ---- */
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  /* scroll reveal は無効化（カードは最初から表示） */
  .reveal{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none;}
    .hero .name .ch,.hero .name-ja,.hero .role,.hero-inner{animation:none;opacity:1;transform:none;filter:none;}
    .hero::before,.hero::after,.flash::before,.flash::after{animation:none;}
    .flash{display:none;}
  }
  /* ---- RTL (Arabic) ---- */
  [dir="rtl"] .lang{right:auto;left:14px;justify-content:flex-start;}
  @media(max-width:400px){[dir="rtl"] .lang{right:auto;left:10px;}}
  [dir="rtl"] .link{flex-direction:row-reverse;text-align:right;}
  [dir="rtl"] .lt{text-align:right;}
  [dir="rtl"] .arr{transform:scaleX(-1);}
  [dir="rtl"] a.link:hover .arr{transform:scaleX(-1) translateX(3px);}
  [dir="rtl"] .note{text-align:right;}
</style>
</head>
<body>

<div class="lang">
  <button id="btn-ja" class="on" onclick="setLang('ja')">日本語</button>
  <button id="btn-en" onclick="setLang('en')">English</button>
  <button id="btn-ko" onclick="setLang('ko')">한국어</button>
  <button id="btn-zh" onclick="setLang('zh')">中文</button>
  <button id="btn-ar" onclick="setLang('ar')">العربية</button>
  <button id="btn-ru" onclick="setLang('ru')">Русский</button>
  <button id="btn-es" onclick="setLang('es')">Español</button>
</div>

<div class="hero" id="hero"></div>

/* ===== render ===== */
function render(lang){
  const d = DATA[lang];

  // ---- hero: 全要素を画像の上に ----
  let hero = '<div class="flash" aria-hidden="true"></div>';
  hero += '<div class="hero-inner">';
  var nm = 'NAGISA SATO';
  var nmHtml = '';
  for(var i=0;i<nm.length;i++){
    var ch = nm[i]===' ' ? '&nbsp;' : nm[i];
    nmHtml += '<span class="ch" style="animation-delay:'+(0.25+i*0.05).toFixed(2)+'s">'+ch+'</span>';
  }
  hero += '<h1 class="name">'+nmHtml+'</h1>';
  if(d.nameJa) hero += '<div class="name-ja">'+d.nameJa+'</div>';
  hero += '<p class="role">'+d.role+'</p>';
  hero += '</div>';
  document.getElementById('hero').innerHTML = hero;


  // ---- links ----
  let html = '';
  d.sections.forEach(sec=>{
    html += '<section class="sec"><div class="sec-t">'+sec.t+'</div>';
    sec.links.forEach(k=>{
      if(k.divider){
        var isMain = (k.divider.indexOf('レクラン')>-1 || k.divider.indexOf('LECRIN')>-1 || k.divider.indexOf('IKI')>-1);
        html += '<div class="divider reveal'+(isMain?' main':'')+'"><span>'+k.divider+'</span></div>';
      }
      if(k.copy){
        html += '<a class="link reveal" href="javascript:void(0)" onclick="copyId(\''+k.copy+'\',this)">';
      } else {
        html += '<a class="link reveal'+(k.desc?' biz-link':'')+'" href="'+k.u+'" target="_blank" rel="noopener">';
      }
      html += IC[k.ic];
      html += '<span class="lt'+(k.desc?' biz':'')+'">';
      if(k.desc) html += '<span class="desc">'+k.desc+'</span>';
      html += '<span class="l1">'+k.l1+'</span><span class="l2">'+k.l2+'</span>';
      html += '</span><span class="arr">'+(k.copy?'⧉':'→')+'</span></a>';
    });
    if(sec.note) html += '<p class="note">'+sec.note+'</p>';
    html += '</section>';
  });
  html += '<div class="foot reveal">© Nagisa Sato</div>';

  const wrap = document.getElementById('wrap');
  wrap.classList.remove('fade');
  void wrap.offsetWidth;
  wrap.classList.add('fade');
  wrap.innerHTML = html;

  setupReveal();
}

function setupReveal(){
  /* スクロール連動アニメは無効化（読み込み遅延に見えるため）。
     reveal/in クラスは残置するが CSS 側で常時表示になっている */
}

function copyId(id, el){
  const done = ()=>{
    const toast = document.getElementById('toast');
    toast.textContent = 'ID「'+id+'」をコピーしました';
    toast.classList.add('show');
    clearTimeout(window.__t);
    window.__t = setTimeout(()=>toast.classList.remove('show'),1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(id).then(done).catch(()=>fallbackCopy(id,done));
  } else {
    fallbackCopy(id,done);
  }
}
function fallbackCopy(text, cb){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  if(cb)cb();
}

function setLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==='ar') ? 'rtl' : 'ltr';
  ['ja','en','ko','zh','ar','ru','es'].forEach(function(l){
    document.getElementById('btn-'+l).classList.toggle('on', lang===l);
  });
  render(lang);
}

const initLang = (function(){
  var l = (navigator.language||'ja').toLowerCase();
  if(l.startsWith('ja')) return 'ja';
  if(l.startsWith('ko')) return 'ko';
  if(l.startsWith('zh')) return 'zh';
  if(l.startsWith('ar')) return 'ar';
  if(l.startsWith('ru')) return 'ru';
  if(l.startsWith('es')) return 'es';
  if(l.startsWith('en')) return 'en';
  return 'ja';
})();
setLang(initLang);
